name: Publicar em Produção

on:
  workflow_dispatch:
    inputs:
      atualizar_metadados:
        description: 'Atualizar também metadados da loja (screenshots/textos) depois de publicar?'
        required: false
        default: false
        type: boolean
      changelog_en:
        description: 'Changelog em en-US (opcional)'
        required: false
        type: string
      changelog_pt:
        description: 'Changelog em pt-BR (opcional)'
        required: false
        type: string
      changelog_es:
        description: 'Changelog em es-419 (opcional)'
        required: false
        type: string

jobs:
  validate-secrets:
    uses: ./.github/workflows/validate-secrets.yml
    secrets: inherit

  publish:
    needs: validate-secrets
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version_name: ${{ steps.bump.outputs.version_name }}
      version_code: ${{ steps.bump.outputs.version_code }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Incrementar versão (ainda não commitada)
        id: bump
        run: node scripts/bump-version.js

      - name: Restaurar keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > RNBibleKeystore.jks

      - name: Configurar memória do Gradle
        run: |
          echo "" >> android/gradle.properties
          echo "org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g" >> android/gradle.properties
          echo "org.gradle.workers.max=1" >> android/gradle.properties

      - name: Build AAB assinado
        run: |
          cd android && ./gradlew bundleRelease \
            -PRNBIBLE_UPLOAD_KEY_ALIAS="${{ secrets.ANDROID_KEY_ALIAS }}" \
            -PRNBIBLE_UPLOAD_STORE_PASSWORD="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -PRNBIBLE_UPLOAD_KEY_PASSWORD="${{ secrets.ANDROID_KEY_PASSWORD }}" \
            -x lintVitalAnalyzeRelease \
            --continue \
            --stacktrace

      - name: Instalar Fastlane
        run: sudo gem install fastlane

      - name: Restaurar Service Account Key do Google
        run: |
          cat > google-service-account.json << 'EOF'
          ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          EOF

      - name: Enviar para a Play Store (produção)
        run: |
          fastlane supply \
            --json_key google-service-account.json \
            --package_name com.reactnativebible \
            --aab android/app/build/outputs/bundle/release/app-release.aab \
            --track production \
            --skip_upload_metadata true \
            --skip_upload_screenshots true \
            --skip_upload_changelogs true

      - name: Commitar nova versão na main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add android/app/build.gradle
          git commit -m "ci: bump version to ${{ steps.bump.outputs.version_name }} [skip ci]"
          git push origin master

      - name: Sincronizar develop com master
        run: |
          git fetch origin develop
          git checkout develop
          git merge origin/master -m "ci: sync develop with master after version bump [skip ci]"
          git push origin develop

      - name: Criar e subir tag da versão publicada
        run: |
          git checkout master
          git tag v${{ steps.bump.outputs.version_name }}
          git push origin v${{ steps.bump.outputs.version_name }}

  publish-metadata:
    needs: publish
    if: ${{ inputs.atualizar_metadados == true }}
    uses: ./.github/workflows/publish-metadata.yml
    with:
      version_code: ${{ needs.publish.outputs.version_code }}
      changelog_en: ${{ inputs.changelog_en }}
      changelog_pt: ${{ inputs.changelog_pt }}
      changelog_es: ${{ inputs.changelog_es }}
    secrets: inherit
